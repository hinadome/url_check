# URL Checker — nginx reverse proxy (HTTP front door)
# Placeholders replaced by scripts/deploy-vm.sh:
#   __SERVER_NAME__  __NGINX_PORT__  __APP_PORT__
#   __CLIENT_MAX_BODY__  __PROXY_READ_TIMEOUT__
#   __LISTEN_DEFAULT__  — either " default_server" or empty (never steal default if others exist)
#   __UPSTREAM_NAME__   — unique upstream block name for this app
#
# This file only defines the URL Checker site. Other nginx sites are left untouched.
# Next.js should listen on 127.0.0.1:__APP_PORT__ when this proxy is used.

upstream __UPSTREAM_NAME__ {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen __NGINX_PORT____LISTEN_DEFAULT__;
    listen [::]:__NGINX_PORT____LISTEN_DEFAULT__;
    server_name __SERVER_NAME__;

    # Large check payloads (HTML + screenshot base64 in JSON responses / uploads)
    client_max_body_size __CLIENT_MAX_BODY__;

    # Playwright checks can take up to ~60s
    proxy_connect_timeout 60s;
    proxy_send_timeout __PROXY_READ_TIMEOUT__;
    proxy_read_timeout __PROXY_READ_TIMEOUT__;

    location / {
        proxy_pass http://__UPSTREAM_NAME__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
