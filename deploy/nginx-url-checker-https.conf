# URL Checker — nginx HTTPS front (+ HTTP → HTTPS redirect)
# Placeholders replaced by scripts/setup-https.sh:
#   __SERVER_NAME__  __APP_PORT__  __CLIENT_MAX_BODY__  __PROXY_READ_TIMEOUT__
#   __SSL_CERT__  __SSL_KEY__
#
# Certificates are expected under Let's Encrypt:
#   /etc/letsencrypt/live/__SERVER_NAME__/fullchain.pem
#   /etc/letsencrypt/live/__SERVER_NAME__/privkey.pem

upstream url_checker_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

# ACME HTTP-01 + redirect everything else to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Large check payloads (HTML + screenshot base64 in JSON)
    client_max_body_size __CLIENT_MAX_BODY__;

    # Playwright checks can take up to ~60s+
    proxy_connect_timeout 60s;
    proxy_send_timeout __PROXY_READ_TIMEOUT__;
    proxy_read_timeout __PROXY_READ_TIMEOUT__;

    location / {
        proxy_pass http://url_checker_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
