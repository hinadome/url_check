# URL Checker — Docker Compose
# Usage: ./scripts/deploy-container.sh
#    or: docker compose up -d --build

services:
  url-checker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_VERSION: "1.62.1"
    image: url-checker:local
    container_name: url-checker
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Optional: increase if checks are heavy
      # NODE_OPTIONS: "--max-old-space-size=4096"
    restart: unless-stopped
    # Chromium in Docker often needs more shared memory than the default 64MB
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
